# =============================================================================
#  ALPHA-XAU — Quality gate (CI)
#
#  Runs the deterministic test suite (scripts/run_ci_tests.mjs) and the
#  TypeScript typecheck (backend/**/*.ts, tsconfig.json) on every PR and
#  push to main. No deploy, no database access, no secrets, no external
#  paid API calls — read-only, self-contained checks only.
# =============================================================================

name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  event-impact-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: xau_ei_rpc_test
          POSTGRES_PASSWORD: xau-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xau_ei_rpc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: xau_ei_rpc_test
      PGUSER: postgres
      PGPASSWORD: xau-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Event Impact transactional and concurrent contract
        run: node tests/test_event_impact_rpc_postgres.mjs

