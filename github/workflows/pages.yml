# =============================================================================
#  ALPHA-XAU — Déploiement GitHub Pages (correctif P0-2)
#
#  Publie frontend/ tel quel. Aucun build, aucun bundler : le terminal est
#  en HTML/CSS/JS natif et doit le rester.
#
#  INJECTION DE CONFIGURATION
#  index.html contient un bloc window.ALPHA_XAU_CONFIG avec des valeurs
#  vides (mode démo). Ce workflow y substitue les valeurs PUBLIQUES tirées
#  des GitHub *Variables*.
#
#  Ce sont des Variables, pas des Secrets, et c'est délibéré : ces deux
#  valeurs sont publiques par nature (elles finissent dans le HTML servi).
#  Les stocker en Secret donnerait une fausse impression de confidentialité.
#  La clé anon n'ouvre que ce que les policies RLS autorisent — lecture du
#  marché, des news et des analyses. La clé service_role n'apparaît nulle
#  part dans ce workflow.
# =============================================================================

name: Deploy terminal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois. `cancel-in-progress: false` : on ne veut
# pas interrompre un déploiement déjà engagé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject public runtime configuration
        env:
          SUPABASE_URL: ${{ vars.ALPHA_XAU_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.ALPHA_XAU_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::warning::Variables absentes — le terminal sera publié en MODE DÉMO."
          else
            python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('frontend/index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r"SUPABASE_URL: ''",
                        "SUPABASE_URL: '%s'" % os.environ['SUPABASE_URL'], html, count=1)
          html = re.sub(r"SUPABASE_ANON_KEY: ''",
                        "SUPABASE_ANON_KEY: '%s'" % os.environ['SUPABASE_ANON_KEY'], html, count=1)
          path.write_text(html, encoding='utf-8')
          print('Configuration injectée.')
          PY
          fi

      - name: Guard against secret leakage
        run: |
          set -euo pipefail
          python3 - <<'GUARD'
          """
          Garde anti-fuite du frontend publié sur GitHub Pages.

          Ce contrôle s'exécute APRÈS l'injection de configuration : il porte
          donc sur le contenu réellement publiable, index.html compris.

          Version précédente et sa faille :
            grep -rIl 'service_role' frontend/ | grep -v 'index.html'
          Deux défauts démontrés par exécution :
            1. index.html était exclu — or c'est le SEUL fichier où le
               workflow injecte une valeur. Une clé collée là passait.
            2. Le contrôle cherchait le MOT 'service_role'. Une vraie clé
               Supabase est un JWT : le rôle n'apparaît que dans une charge
               utile base64url. Le mot n'est jamais visible en clair, donc
               une vraie clé passait dans TOUS les fichiers, y compris .js.

          Trois règles remplacent ce grep :
            A. Tout JWT est décodé ; un rôle autre que 'anon' est bloqué.
               C'est la seule règle qui attrape une vraie clé.
            B. 'sk-ant-' n'importe où, commentaire inclus : un secret publié
               reste un secret publié.
            C. Le mot 'service_role' hors commentaire — filet pour les
               placeholders et variables mal nommées. Les commentaires de
               documentation d'index.html sont retirés avant recherche, ce
               qui évite le faux positif qui avait motivé l'exclusion.
          """
          import base64, json, pathlib, re, sys

          ROOT = pathlib.Path("frontend")
          TEXT_SUFFIXES = {".html", ".js", ".css", ".json", ".svg", ".txt", ".md", ""}
          findings = []

          def strip_comments(text: str) -> str:
              """Retire commentaires HTML, puis // et /* */ hors chaînes.

              L'état de chaîne est réinitialisé à chaque ligne : une
              apostrophe française isolée ne peut donc pas neutraliser le
              reste du fichier. Le stripper ne fait que RETIRER : en cas de
              doute il conserve, ce qui va dans le sens de la détection.
              """
              # Les commentaires HTML sont remplacés par autant de retours
              # à la ligne qu'ils en contenaient : les numéros de ligne
              # rapportés restent ceux du fichier réel. Un garde qui désigne
              # la mauvaise ligne envoie l'opérateur chercher au mauvais
              # endroit un secret qu'il doit révoquer en urgence.
              text = re.sub(
                  r"<!--.*?-->",
                  lambda m: "\n" * m.group(0).count("\n"),
                  text,
                  flags=re.S,
              )
              out, in_block = [], False
              for line in text.split("\n"):
                  buf, i, quote = [], 0, None
                  while i < len(line):
                      ch = line[i]
                      if in_block:
                          if line.startswith("*/", i):
                              in_block = False
                              i += 2
                              continue
                          i += 1
                          continue
                      if quote:
                          buf.append(ch)
                          if ch == "\\":
                              if i + 1 < len(line):
                                  buf.append(line[i + 1])
                              i += 2
                              continue
                          if ch == quote:
                              quote = None
                          i += 1
                          continue
                      if ch in "\"'`":
                          quote = ch
                          buf.append(ch)
                          i += 1
                          continue
                      if line.startswith("//", i):
                          break
                      if line.startswith("/*", i):
                          in_block = True
                          i += 2
                          continue
                      buf.append(ch)
                      i += 1
                  out.append("".join(buf))
              return "\n".join(out)

          def jwt_role(token: str):
              """Rôle porté par un JWT, ou None si indécodable."""
              parts = token.split(".")
              if len(parts) < 2:
                  return None
              payload = parts[1]
              payload += "=" * (-len(payload) % 4)
              try:
                  claims = json.loads(base64.urlsafe_b64decode(payload))
              except Exception:
                  return None
              if not isinstance(claims, dict):
                  return None
              return claims.get("role")

          JWT_RE = re.compile(r"eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{5,}")

          for path in sorted(ROOT.rglob("*")):
              if not path.is_file() or path.suffix.lower() not in TEXT_SUFFIXES:
                  continue
              try:
                  raw = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              stripped = strip_comments(raw)

              # RÈGLE A — JWT décodé. Seul 'anon' est admis.
              for token in JWT_RE.findall(raw):
                  role = jwt_role(token)
                  if role is None:
                      findings.append(f"{path}: JWT au payload indécodable — refus par précaution.")
                  elif role != "anon":
                      findings.append(f"{path}: JWT de rôle '{role}' détecté. Seule la clé anon peut être publiée.")

              # RÈGLE B — clé Anthropic, commentaire inclus.
              for n, line in enumerate(raw.split("\n"), 1):
                  if "sk-ant-" in line:
                      findings.append(f"{path}:{n}: clé Anthropic (sk-ant-) détectée.")

              # RÈGLE C — mot service_role hors commentaire.
              for n, line in enumerate(stripped.split("\n"), 1):
                  if "service_role" in line or "SERVICE_ROLE" in line:
                      findings.append(f"{path}:{n}: référence à service_role hors commentaire.")

              # RÈGLE D — clé Supabase de nouvelle génération (sb_secret_...).
              #
              # Supabase remplace progressivement les JWT anon/service_role par
              # des jetons OPAQUES : sb_publishable_... (public, équivalent
              # anon — jamais signalé ici) et sb_secret_... (privé, équivalent
              # service_role — contourne RLS via BYPASSRLS, ne doit jamais
              # atteindre le frontend).
              #
              # Ces jetons ne sont PAS des JWT : ils ne matchent pas JWT_RE et
              # ne contiennent aucun payload à décoder. La Règle A est donc
              # structurellement aveugle à ce format — corrigé ici par une
              # détection de forme, sur le contenu brut (commentaire inclus :
              # contrairement à "service_role", simple mot, une correspondance
              # ici EST la valeur secrète elle-même).
              #
              # Seuil de 16 caractères après le préfixe : évite un faux positif
              # sur une mention documentaire du préfixe seul (ex. dans un
              # commentaire citant le format), sans connaître la longueur
              # exacte publiée par Supabase pour le suffixe aléatoire.
              SB_SECRET_RE = re.compile(r"sb_secret_[A-Za-z0-9_-]{16,}")
              for n, line in enumerate(raw.split("\n"), 1):
                  if SB_SECRET_RE.search(line):
                      findings.append(f"{path}:{n}: clé Supabase secrète (sb_secret_) détectée.")

          if findings:
              for f in findings:
                  print(f"::error::{f}")
              print(f"::error::{len(findings)} fuite(s) potentielle(s) — publication interrompue.")
              sys.exit(1)

          print("Aucun secret détecté dans le contenu publiable de frontend/.")
          GUARD

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
